<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5BFF">
<title>برنامه تمرین ۴ هفته‌ای</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--ink:#13202C;--mut:#5B6B7A;--card:#fff;--acc:#2D5BFF;--ok:#1F9D6B;--on:#fff;--line:#E3E9EF;--metal:#8A9AAB;--metal2:#6B7B8C;--pad:#2E3A4A;--skin:#D9A683;--skinF:#B98563;--shorts:#2D5BFF;--hair:#2b1d14}
@media(prefers-color-scheme:dark){:root{--bg:#0F1A24;--ink:#EAF0F5;--mut:#9AABBA;--card:#17283A;--acc:#6D8CFF;--on:#0F1A24;--line:#22364a;--metal:#5E7288;--metal2:#46586C;--pad:#1A2A3A;--skin:#C79470;--skinF:#9C6F51;--shorts:#6D8CFF;--hair:#120c08}}
body[data-theme=light]{--bg:#EEF2F5;--ink:#13202C;--mut:#5B6B7A;--card:#fff;--acc:#2D5BFF;--on:#fff;--line:#E3E9EF;--metal:#8A9AAB;--metal2:#6B7B8C;--pad:#2E3A4A;--skin:#D9A683;--skinF:#B98563;--shorts:#2D5BFF;--hair:#2b1d14}
body[data-theme=dark]{--bg:#0F1A24;--ink:#EAF0F5;--mut:#9AABBA;--card:#17283A;--acc:#6D8CFF;--on:#0F1A24;--line:#22364a;--metal:#5E7288;--metal2:#46586C;--pad:#1A2A3A;--skin:#C79470;--skinF:#9C6F51;--shorts:#6D8CFF;--hair:#120c08}
body[data-m=rest]{--bg:#F7B733;--ink:#241800;--mut:#5a4300;--card:#FFD878;--acc:#241800;--on:#F7B733}
body[data-m=hold]{--bg:#2D5BFF;--ink:#fff;--mut:#dbe4ff;--card:#4A71FF;--acc:#fff;--on:#2D5BFF}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7;transition:background .25s}
#app{max-width:520px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:26px;margin:8px 0 0;font-weight:800}
h2{font-size:28px;margin:0;font-weight:800;line-height:1.3}
h3{font-size:16px;margin:22px 0 8px;color:var(--mut);font-weight:600}
p{margin:6px 0}
.mut,.en{color:var(--mut)}
.en{direction:ltr;text-align:right;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.primary{display:block;width:100%;min-height:64px;margin-top:16px;background:var(--acc);color:var(--on);font-size:20px;font-weight:800;transition:transform .1s}
.primary:active{transform:scale(.98)}
.sec{flex:1;min-height:52px;background:var(--card);font-weight:600;border:1px solid var(--line)}
.ghost{padding:8px 4px;color:var(--mut);font-weight:600}
.row{display:flex;gap:10px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--card);margin:6px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border-radius:24px;padding:20px;border:1px solid var(--line)}
.setno{margin-top:10px;font-weight:600}
.big{font-size:120px;line-height:1.05;font-weight:800;color:var(--acc);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.unit{text-align:center;font-weight:600;margin-top:-6px}
.ex{text-align:center;color:var(--mut);font-weight:600}
.tip{margin-top:14px;padding-top:12px;border-top:2px solid var(--bg);color:var(--mut);font-size:15px}
.w{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-weight:600;flex-wrap:wrap}
.w .stepper{display:flex;align-items:center;gap:6px}
.w input{width:100px;min-height:48px;border:2px solid var(--mut);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:20px;text-align:center}
.w button{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);padding:14px 8px;min-height:84px;font-weight:800;font-size:17px;border:1px solid var(--line)}
.tile small{display:block;font-weight:400;font-size:12px;color:var(--mut);line-height:1.4;margin-top:2px}
.tile.d{background:var(--ok);color:#fff;border-color:var(--ok)}.tile.d small{color:#e6fff3}
.tile.d::after{content:" ✓"}
.tile.nx{outline:3px solid var(--acc)}
.chk{list-style:none;padding:0;margin:10px 0 0}
.chk li{padding:8px 0;border-bottom:1px solid var(--bg)}
.chk input{width:22px;height:22px;margin-left:10px;vertical-align:middle;accent-color:var(--acc)}
.rest{text-align:center;padding-top:2vh}
.rest p{font-size:18px;font-weight:600}
.rest .big{color:var(--ink);font-size:130px}
.ring{position:relative;display:inline-block;margin:4px auto}
.ring svg{display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:rgba(0,0,0,.08)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .25s linear}
.tabs{display:flex;gap:6px;margin:10px 0 4px;background:var(--card);border-radius:16px;padding:6px;border:1px solid var(--line)}
.tabs button{flex:1;min-height:44px;border-radius:12px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--on)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat .box{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
.stat .box b{display:block;font-size:22px;font-weight:800;color:var(--acc)}
.stat .box small{color:var(--mut);font-size:12px}
.hist{list-style:none;padding:0;margin:0}
.hist li{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist li small{display:block;color:var(--mut);font-size:12px}
.spark{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:10px}
.spark i{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-height:4px;opacity:.85}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}
.sw input[type=checkbox]{width:48px;height:28px;appearance:none;background:var(--line);border-radius:14px;position:relative;cursor:pointer;transition:background .2s}
.sw input[type=checkbox]:checked{background:var(--acc)}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s}
.sw input[type=checkbox]:checked::after{right:23px}
select{min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:0 12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.showex{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--bg);border:2px dashed var(--acc);color:var(--acc);padding:8px 14px;border-radius:14px;font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.modal .box{background:var(--card);color:var(--ink);border-radius:24px;max-width:540px;width:100%;padding:14px;text-align:center;position:relative;max-height:94vh;overflow:auto}
.modal .close{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:18px;font-weight:800;z-index:2}
.modal h3{margin:0 0 2px;color:var(--ink);font-size:20px;font-weight:800}
.modal .en{margin:0 0 8px;font-size:13px}
.anim{background:var(--bg);border-radius:18px;padding:4px;margin:6px 0;position:relative}
.anim svg{width:100%;height:auto;max-height:340px;display:block;margin:auto;border-radius:12px}
.mini{cursor:pointer;margin:8px 0 2px}
.mini svg{max-height:210px}
.animctl{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.animctl button{min-width:44px;height:40px;padding:0 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700}
.animctl button.on{background:var(--acc);color:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;justify-content:center}
.chip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:12px;color:#fff}
.chip.p{background:#E5304D}.chip.s{background:#D9820F}
.guide{text-align:right;font-size:13px;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.guide h4{margin:10px 0 4px;font-size:14px;color:var(--acc);font-weight:800}
.guide ul{padding-right:18px;margin:4px 0}
.guide li{margin:3px 0;line-height:1.55}
.guide .step{display:flex;gap:6px;align-items:flex-start;margin:5px 0}
.guide .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.plan{list-style:none;padding:0;margin:12px 0}
.pi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.pi.skp{opacity:.45}
.pn{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--on);font-weight:800;display:flex;align-items:center;justify-content:center}
.pt b{display:block}.pt small{color:var(--mut)}
.pa{display:flex;gap:4px}
.pa button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:15px}
.here{grid-column:1/-1;background:var(--bg);border-radius:12px;min-height:38px;font-weight:700;color:var(--acc);font-size:13px}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;margin-right:4px;color:#fff}
.badge.m0{background:#1F9D6B}.badge.m1{background:#D9820F}.badge.m2{background:#2D5BFF}
.fixed{color:var(--mut);font-size:13px;margin:8px 0;padding:8px 12px;background:var(--card);border-radius:12px;border:1px dashed var(--line)}
.lst{list-style:none;padding:0;margin:8px 0;text-align:right}
.lst li button{display:block;width:100%;text-align:right;padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:6px;font-weight:600}
.lst li.cur button{outline:3px solid var(--acc)}
.lst li.dn button{opacity:.55}
/* svg */
.sk{fill:var(--skin)}.skf{fill:var(--skinF)}.sht{fill:var(--shorts)}.hr{fill:var(--hair)}
.mu.p{fill:#FF3D5A}.mu.s{fill:#FFA63D}.mu.i{fill:var(--mut);opacity:.13}
.mt{fill:var(--metal)}.mt2{fill:var(--metal2)}.pd{fill:var(--pad)}.ac{fill:var(--acc)}.fl{fill:var(--line);opacity:.5}
.ln{fill:none;stroke-linecap:round}
.ln.mt{stroke:var(--metal)}.ln.mt2{stroke:var(--metal2)}.ln.pd{stroke:var(--pad)}.ln.ac{stroke:var(--acc)}.ln.sk{stroke:var(--skin)}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>

<script>
(function(){
'use strict';
const $=function(s){return document.querySelector(s)};
const fa=function(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})};
const en=function(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})};
const pad=function(n){return String(n).padStart(2,'0')};
const fmtDate=function(t){var d=new Date(t);return fa(d.getFullYear())+'/'+fa(pad(d.getMonth()+1))+'/'+fa(pad(d.getDate()))};
const fmtTime=function(s){return fa(pad(Math.floor(s/60)))+':'+fa(pad(s%60))};

/* ================= STATE ================= */
const DEF={v:5,done:[],w:{},cur:null,log:{},history:[],order:{},skip:{},settings:{theme:'auto',sound:true,vibrate:true,unit:'kg',muscles:true,mini:true},startedAt:null};
const clone=function(o){return JSON.parse(JSON.stringify(o))};
let S=clone(DEF);
try{var raw=localStorage.getItem('wk');if(raw){S=Object.assign(clone(DEF),JSON.parse(raw));}}catch(e){}
function fix(){S.order=S.order||{};S.skip=S.skip||{};S.history=S.history||[];S.settings=Object.assign({},DEF.settings,S.settings||{});}
fix();
const save=function(){try{localStorage.setItem('wk',JSON.stringify(S))}catch(e){}};
const KG_TO_LB=2.20462;
const toDisp=function(kg){return S.settings.unit==='lb'?Math.round(kg*KG_TO_LB*2)/2:kg};
const fromDisp=function(v){return S.settings.unit==='lb'?Math.round(v/KG_TO_LB*2)/2:v};

/* ================= AUDIO ================= */
let ac=null;
function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();}
function beep(f,d,t,g){t=t||0;g=g||.3;if(!S.settings.sound||!ac)return;var o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime+t;o.frequency.value=f;v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(v);v.connect(ac.destination);o.start(n);o.stop(n+d)}
function ding(){beep(988,.5,0,.5);beep(1319,.8,.25,.5);if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate([200,100,200])}
function click(){beep(660,.06,0,.15);if(S.settings.vibrate&&navigator.vibrate)navigator.vibrate(20)}

/* ================= WAKE LOCK ================= */
let wl=null;
function lock(){try{if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(function(x){wl=x}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}

/* ================= EXERCISES ================= */
const E={
lp:['پرس پا','Leg Press','۳۰ تا ۵۰ کیلو','پشت و باسن به صندلی؛ ضامن‌های ایمنی را تنظیم کن. زانو قفل نشود و به داخل نیفتد.'],
bs:['اسکات روی نیمکت با کش','Box Squat','وزن بدن','کش بالای زانو. باسن را عقب ببر، آرام بنشین و زانو را بیرون فشار بده.'],
lc:['جلو پشت پا','Leg Curl','۱۵ تا ۲۵ کیلو','پد روی مچ پا. باسن بلند نشود، برگشت آرام.'],
gb:['پل باسن','Glute Bridge','وزن بدن','باسن را تا خط صاف بالا ببر و ۱ ثانیه نگه دار. کمر زیاد قوس نگیرد.'],
ap:['بارفیکس کمکی','Assisted Pull-Up','کمک: ۲۰ تا ۳۰ کیلو','اول شانه‌ها را پایین بکش، بعد سینه را به میله برسان. پایین آمدن ۳ ثانیه. تاب نخور.'],
sr:['زیربغل سیم‌کش نشسته','Seated Cable Row','۲۰ تا ۳۰ کیلو','سینه بالا، کتف‌ها را به هم نزدیک کن، بدن تاب نخورد.'],
pl:['پلانک','Plank','وزن بدن','ساعد و پنجه؛ بدن یک خط صاف. نفس را حبس نکن.'],
pg:['پرش مچ پا','Pogo Jumps','وزن بدن','زانوها تقریباً صاف، جهش کوتاه و سریع روی جلوی پا.'],
sj:['پرش اسکات','Squat Jump','وزن بدن','با تمام قدرت بپر و نرم فرود بیا؛ زانو داخل نیفتد. بین تکرارها ۳ تا ۵ ثانیه مکث کن.'],
sp:['دوی سرعت','Sprint','زمین صاف','بعد از گرم کردن کامل. برگشت پیاده. اگر پشت ران درد گرفت قطع کن. روی تردمیل: ۲۰ ثانیه دوی تند اما کنترل‌شده.'],
cp:['پرس سینه دستگاه','Chest Press Machine','۱۵ تا ۲۵ کیلو','کتف‌ها به پشتی، آرنج قفل نشود.'],
lat:['لت','Lat Pulldown','۲۵ تا ۴۰ کیلو','میله را به بالای سینه بکش؛ پشت گردن نه.'],
fp:['فیس پول سیم‌کش','Face Pull','۸ تا ۱۵ کیلو','طناب هم‌سطح صورت، آرنج بالا، خیلی سبک.'],
db:['دد باگ','Dead Bug','وزن بدن','کمر به زمین بچسبد؛ دست راست و پای چپ را دراز کن.'],
su:['بالا رفتن از پله کوتاه','Step-Up','وزن بدن، جعبه ۲۰ تا ۳۰ سانتی‌متر','با پای بالا فشار بده؛ زانو داخل نیفتد.'],
sg:['پل باسن تک‌پا','Single-Leg Glute Bridge','وزن بدن','یک پا بالا؛ لگن نچرخد.'],
ha:['دور کردن پا از بدن','Hip Abduction','۱۵ تا ۲۵ کیلو','پاها را آرام بیرون ببر و آرام برگردان.'],
cr:['ساق پا ایستاده','Calf Raise','۲۰ تا ۴۰ کیلو','دامنه کامل، ۱ ثانیه در بالا.'],
dh:['آویزان ماندن','Dead Hang','وزن بدن','شانه‌ها کمی پایین؛ درد شانه یعنی قطع.'],
bd:['باردوم','Bird Dog','وزن بدن','دست راست و پای چپ را همزمان دراز کن، ۲ ثانیه نگه دار.']};

/* 0 = بدون دستگاه ، 1 = وسیله کمکی (جعبه/کش/میله) ، 2 = دستگاه */
const MACH={lp:2,bs:1,lc:2,gb:0,ap:2,sr:2,pl:0,pg:0,sj:0,sp:0,cp:2,lat:2,fp:2,db:0,su:1,sg:0,ha:2,cr:2,dh:1,bd:0};
const MLAB=['بدون دستگاه','وسیله کمکی','دستگاه'];

const GUIDE={

function exItems(n){
  var w=Math.floor((n-1)/3),P=PL['ABC'[(n-1)%3]];
  return P.ex.map(function(item){
    var m=/(\d+)x(\d+)([sme]?)/.exec(item[1][w]);
    return {k:'s',id:item[0],n:+m[1],reps:+m[2],u:m[3],rest:item[2],fx:item[3]&&item[3][w]};
  });
}
function build(n,ids){
  var w=Math.floor((n-1)/3),P=PL['ABC'[(n-1)%3]],map={};
  exItems(n).forEach(function(x){map[x.id]=x});
  var st=[{k:'n',t:'گرم کردن',x:WARM},{k:'n',t:'بلوک اصلاحی: ۲ دور',x:CORR}];
  ids.forEach(function(id){if(map[id])st.push(map[id])});
  st.push({k:'n',t:P.ct,x:P.c[w]},{k:'n',t:'سرد کردن',x:COOL});
  return st;
}
function origOrder(n){return exItems(n).map(function(x){return x.id})}
function defOrder(n){
  return exItems(n).map(function(x,i){return {id:x.id,i:i,m:MACH[x.id]}})
    .sort(function(a,b){return a.m-b.m||a.i-b.i}).map(function(x){return x.id});
}
function getOrder(n){
  var o=S.order[String(n)],base=origOrder(n);
  if(o&&o.length===base.length&&base.every(function(x){return o.indexOf(x)>=0}))return o.slice();
  return defOrder(n);
}
function getSkip(n){return S.skip[String(n)]||[]}
function setsText(it){var u={s:'ثانیه',m:'متر',e:'تکرار هر طرف','':'تکرار'}[it.u];return fa(it.n)+' ست × '+fa(it.reps)+' '+u}

/* ================= KINEMATICS ================= */
const NS='http://www.w3.org/2000/svg';
const L={tr:54,nk:8,th:42,sh:40,ft:16,ua:30,fa:28};
const RD=Math.PI/180;
function dv(a,l){return [Math.sin(a*RD)*l,Math.cos(a*RD)*l]}
function add(p,v){return [p[0]+v[0],p[1]+v[1]]}
function sm(t){return t*t*(3-2*t)}
function ik(H,T,a,b,sg){
  var dx=T[0]-H[0],dy=T[1]-H[1],d=Math.hypot(dx,dy);
  d=Math.min(Math.max(d,Math.abs(a-b)+.5),a+b-.05);
  var phi=Math.atan2(dx,dy),c=(a*a+d*d-b*b)/(2*a*d);
  var al=Math.acos(Math.max(-1,Math.min(1,c))),A=phi+sg*al;
  return [[H[0]+Math.sin(A)*a,H[1]+Math.cos(A)*a],[H[0]+Math.sin(phi)*d,H[1]+Math.cos(phi)*d]];
}
function solve(p,flip){
  var hip=[p.hx,p.hy];
  var sh=[hip[0]+Math.sin(p.tr*RD)*L.tr,hip[1]-Math.cos(p.tr*RD)*L.tr];
  var ha=(p.tr+p.hd)*RD,hu=[Math.sin(ha),-Math.cos(ha)],hf=[Math.cos(ha),Math.sin(ha)];
  var nk=[sh[0]+hu[0]*L.nk,sh[1]+hu[1]*L.nk];
  var hc=[sh[0]+hu[0]*(L.nk+10),sh[1]+hu[1]*(L.nk+10)];
  function leg(th,k,pl,ank,ft){
    var K,A;
    if(ank){var r=ik(hip,ank,L.th,L.sh,1);K=r[0];A=r[1];}
    else{K=add(hip,dv(th,L.th));A=add(K,dv(th-k,L.sh));}
    var s=Math.atan2(A[0]-K[0],A[1]-K[1])/RD;
    var f=(ft!=null)?ft:90+s+pl;
    return {K:K,A:A,T:add(A,dv(f,L.ft))};
  }
  function arm(u,e,h){
    if(h){var r=ik(sh,h,L.ua,L.fa,p.sgA||-1);return {E:r[0],W:r[1]};}
    var E=add(sh,dv(u,L.ua));return {E:E,W:add(E,dv(u+e,L.fa))};
  }
  var ftF=(p.ftF!=null)?p.ftF:p.ftN;
  var N=leg(p.th,p.k,p.pl||0,p.ankN,p.ftN),F;
  if(p.ankF)F=leg(0,0,0,p.ankF,ftF);
  else if(p.thF!=null)F=leg(p.thF,p.kF!=null?p.kF:0,p.plF!=null?p.plF:(p.pl||0),null,ftF);
  else if(p.ankN)F=leg(0,0,0,p.ankN,ftF);
  else F=leg(p.th,p.k,p.pl||0,null,ftF);
  var aN=arm(p.ua,p.e,p.hndN),aF;
  if(p.hndF)aF=arm(0,0,p.hndF);
  else if(p.uaF!=null)aF=arm(p.uaF,p.eF!=null?p.eF:0,null);
  else if(p.hndN)aF=arm(0,0,p.hndN);
  else aF=arm(p.ua,p.e,null);
  var P={hip:hip,sh:sh,nk:nk,hc:hc,nK:N.K,nA:N.A,nT:N.T,fK:F.K,fA:F.A,fT:F.T,nE:aN.E,nW:aN.W,fE:aF.E,fW:aF.W};
  if(flip){for(var k in P){P[k]=[P[k][0],2*hip[1]-P[k][1]]}hf[1]=-hf[1];hu[1]=-hu[1];}
  if(p.anc){
    var ref=p.ancF?P.fA:P.nA,dx=p.anc[0]-ref[0],dy=p.anc[1]-ref[1];
    for(var k2 in P){P[k2]=[P[k2][0]+dx,P[k2][1]+dy]}
  }
  P.hf=hf;P.hu=hu;
  return P;
}

var n1=function(v){return Math.round(v*10)/10};

function mix(A,B,t){
  var o={};
  for(var k in A){
    var a=A[k],b=B[k];
    if(typeof a==='number'&&typeof b==='number')o[k]=a+(b-a)*t;
    else if(Array.isArray(a)&&Array.isArray(b))o[k]=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
    else o[k]=a;
  }
  return o;
}
function poseAt(ex,t){
  var K=ex.keys,n=K.length,acc=0,i=0;
  for(;i<n;i++){if(t<acc+K[i].d)break;acc+=K[i].d}
  if(i>=n){i=n-1;acc-=K[i].d}
  var A=K[i],B=K[(i+1)%n],e=sm(Math.max(0,Math.min(1,(t-acc)/A.d)));
  return {p:mix(A.p,B.p,e),load:A.l+(B.l-A.l)*e};
}

function suggestWeight(id){
  var hist=S.log[id];
  if(!hist||!hist.length)return '';
  return hist[hist.length-1].weight||'';
}
function recordPR(id,weight,reps){
  if(!weight)return false;
  var hist=S.log[id]||(S.log[id]=[]),best={weight:0,reps:0};
  for(var i=0;i<hist.length;i++){var x=hist[i];if(x.weight>best.weight||(x.weight===best.weight&&x.reps>best.reps))best=x;}
  var isPR=weight>best.weight||(weight===best.weight&&reps>best.reps);
  hist.push({weight:weight,reps:reps,at:Date.now()});
  if(hist.length>30)hist.shift();
  return isPR;
}
let tId=null;
function toast(msg){var t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(tId);tId=setTimeout(function(){t.classList.remove('on')},1800)}

function startSession(n,atId){
  initAudio();
  n=+n;
  if(atId&&getSkip(n).indexOf(atId)>=0)S.skip[String(n)]=getSkip(n).filter(function(x){return x!==atId});
  var skip=getSkip(n),ids=getOrder(n).filter(function(x){return skip.indexOf(x)<0});
  if(!ids.length){toast('حداقل یک حرکت باید فعال باشد');return}
  var i=0;
  if(atId&&ids.indexOf(atId)>=0)i=2+ids.indexOf(atId);
  R_={n:n,ids:ids,steps:build(n,ids),i:i,s:0,ph:'work',end:0,sessionStart:Date.now(),tonnage:0,prs:[]};
  lock();go();
}

  plan:function(n){PLN={n:+n};tab='plan';render();},

  resume:function(){

    R_={n:c.n,ids:ids,steps:build(c.n,ids),i:c.i,s:c.s,ph:'work',end:0,sessionStart:c.startedAt||Date.now(),tonnage:0,prs:[]};
    lock();go();
  },
  home:function(){R_=null;tab='home';render();},
  next:function(){R_.i++;R_.s=0;go();},
  done:function(){doneSet();},
  hold:function(){R_.ph='hold';R_.lt=0;R_.end=Date.now()+R_.steps[R_.i].reps*1000;render();},
  skip:function(){endRest();},

function doneSet(){

  if(w&&w.value){weight=fromDisp(+en(w.value));S.w[st.id]=w.value;}
  var reps=st.reps,isPR=recordPR(st.id,weight,reps);
  if(isPR)R_.prs.push({id:st.id,weight:weight,reps:reps});
  if(weight)R_.tonnage+=weight*reps;
  var ni=R_.i,ns=R_.s+1;if(ns>=st.n){ni++;ns=0;}
  var nx=R_.steps[ni];R_.nx={i:ni,s:ns};
  if(!nx||nx.k==='n'){R_.i=ni;R_.s=ns;R_.ph='work';R_.end=0;go();return;}
  R_.ph='rest';R_.lt=0;R_.end=Date.now()+st.rest*1000;save();render();
}

  var total=12,done=S.done.length,nxt=null;
  for(var i=1;i<=total;i++){if(S.done.indexOf(i)<0){nxt=i;break;}}
  var h='<h1>برنامه تمرین ۴ هفته‌ای</h1><p class="mut">'+fa(done)+' از '+fa(total)+' جلسه انجام شده · '+fa(Math.round(done/total*100))+'٪</p>';
  h+='<div class="tabs"><button class="'+(tab==='home'?'on':'')+'" data-a="tab" data-n="home">برنامه</button><button class="'+(tab==='hist'?'on':'')+'" data-a="tab" data-n="hist">تاریخچه</button><button class="'+(tab==='set'?'on':'')+'" data-a="tab" data-n="set">تنظیمات</button></div>';
  if(tab==='home'){
    if(S.cur)h+='<button class="primary" data-a="resume">ادامه جلسه '+fa(S.cur.n)+'</button>';
    for(var w=0;w<4;w++){
      h+='<h3>هفته '+fa(w+1)+'</h3><div class="grid">';
      for(var k=1;k<=3;k++){var n=w*3+k;
        h+='<button class="tile'+(S.done.indexOf(n)>=0?' d':'')+(n===nxt?' nx':'')+'" data-a="plan" data-n="'+n+'">جلسه '+fa(n)+'<small>'+PL['ABC'[k-1]].name+'</small></button>';
      }
      h+='</div>';
    }
    h+='<p class="mut" style="margin-top:24px;font-size:14px">روی هر جلسه بزن تا قبل از شروع، ترتیب حرکت‌ها را بچینی. دوشنبه و چهارشنبه و شنبه یا هر سه روز با فاصله. وزنه‌ها را در هر ست وارد کن؛ جلسه بعد همان عدد نمایش داده می‌شود.</p>';
  } else if(tab==='hist'){
    var H=S.history||[],totalT=0;for(var j=0;j<H.length;j++)totalT+=H[j].tonnage||0;
    h+='<div class="stat"><div class="box"><b>'+fa(done)+'</b><small>جلسه انجام‌شده</small></div><div class="box"><b>'+fa(Math.round(totalT))+'</b><small>کیلوگرم حجم کل</small></div></div>';
    if(H.length){
      var recent=H.slice(0,6).reverse(),max=1;
      for(var r=0;r<recent.length;r++){if((recent[r].tonnage||0)>max)max=recent[r].tonnage||0;}
      h+='<div class="spark">';
      for(var r2=0;r2<recent.length;r2++){var x=recent[r2];h+='<i style="height:'+Math.max(4,((x.tonnage||0)/max)*60)+'px"></i>';}
      h+='</div><h3>جلسات اخیر</h3><ul class="hist">';
      for(var q=0;q<H.length;q++){var y=H[q];
        h+='<li><div><b>جلسه '+fa(y.n)+'</b><small>'+fmtDate(y.at)+' · '+fmtTime(y.dur||0)+(y.prs&&y.prs.length?' · 🏆 '+fa(y.prs.length):'')+'</small></div><div class="mut">'+fa(Math.round(y.tonnage||0))+' کیلو</div></li>';
      }
      h+='</ul>';
    } else h+='<p class="mut">هنوز جلسه‌ای ثبت نشده.</p>';
  } else {
    h+='<section class="card">';
    h+='<div class="sw"><span>تم</span><select id="thm"><option value="auto"'+(S.settings.theme==='auto'?' selected':'')+'>خودکار</option><option value="light"'+(S.settings.theme==='light'?' selected':'')+'>روشن</option><option value="dark"'+(S.settings.theme==='dark'?' selected':'')+'>تیره</option></select></div>';
    h+='<div class="sw"><span>واحد</span><select id="unt"><option value="kg"'+(S.settings.unit==='kg'?' selected':'')+'>کیلوگرم</option><option value="lb"'+(S.settings.unit==='lb'?' selected':'')+'>پوند</option></select></div>';
    h+='<div class="sw"><span>صدا</span><input type="checkbox" data-a="set" data-k="sound"'+(S.settings.sound?' checked':'')+'></div>';
    h+='<div class="sw"><span>لرزش</span><input type="checkbox" data-a="set" data-k="vibrate"'+(S.settings.vibrate?' checked':'')+'></div>';
    h+='<div class="sw"><span>انیمیشن حرکت در صفحه تمرین</span><input type="checkbox" data-a="set" data-k="mini"'+(S.settings.mini!==false?' checked':'')+'></div>';
    h+='<div class="sw"><span>نمایش عضلات روی انیمیشن</span><input type="checkbox" data-a="set" data-k="muscles"'+(S.settings.muscles!==false?' checked':'')+'></div>';
    h+='<div class="sw"><span>پشتیبان‌گیری</span><button class="ghost" data-a="export">📤 خروجی</button></div>';
    h+='<div class="sw"><span>بازیابی</span><button class="ghost" data-a="import">📥 ورودی</button><input id="imp" type="file" accept="application/json" hidden></div>';
    h+='</section><button class="ghost" data-a="reset" style="margin-top:16px">پاک کردن همه چیز</button>';
  }
  a.innerHTML=h;
  var thm=$('#thm');if(thm)thm.onchange=function(){A.setTheme(thm.value);};
  var unt=$('#unt');if(unt)unt.onchange=function(){A.setUnit(unt.value);};
}

function applyTheme(){
  var t=S.settings.theme;
  if(t==='auto')document.body.removeAttribute('data-theme');else document.body.dataset.theme=t;
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}

window.__dbg={EX:EX,solve:solve,poseAt:poseAt,MUS:MUS,defOrder:defOrder,build:build,MACH:MACH};
render();
})();
</script>
</body>
</html>
